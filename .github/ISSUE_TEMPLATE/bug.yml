name: Bug
description: A component doesn't install, render or behave as documented.
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: agent-figure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The install command you ran and the smallest code that shows the problem.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Next.js 15, React 19, Tailwind 4, Chrome 139
